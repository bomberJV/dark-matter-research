name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  engine:
    name: Browser engine matches rates.py
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test lz-event-audit/web/test_engine.mjs

  validate:
    name: Rate engine against published numbers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Reproduce results/validation.txt
        working-directory: lz-event-audit
        run: |
          python validate.py > "$RUNNER_TEMP/validation.txt"
          diff -u --strip-trailing-cr -Z results/validation.txt "$RUNNER_TEMP/validation.txt"
